<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Galería de imágenes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Galería de imágenes</h1>
      <div class="d-flex gap-2">
        <a href="upload.html" class="btn btn-primary">Subir nueva</a>
        <a href="index.html" class="btn btn-outline-secondary">Inicio</a>
      </div>
    </div>

    <div id="mensajeVacio" class="alert alert-secondary" style="display:none;">
      Todavía no hay imágenes subidas.
    </div>

    <div id="mensajeError" class="alert alert-danger" style="display:none;">
      No se pudieron cargar las imágenes.
    </div>

    <div id="galeria" class="row row-cols-2 row-cols-md-4 g-3"></div>
  </div>

  <script>
    const galeria = document.getElementById('galeria');
    const mensajeVacio = document.getElementById('mensajeVacio');
    const mensajeError = document.getElementById('mensajeError');

    async function cargarImagenes() {
      try {
        const res = await fetch('/api/imagenes');
        const json = await res.json();

        if (!json.ok) {
          mensajeError.style.display = 'block';
          return;
        }

        if (json.total === 0) {
          mensajeVacio.style.display = 'block';
          return;
        }

        json.imagenes.forEach((img) => {
          const col = document.createElement('div');
          col.className = 'col';
          col.innerHTML = `
            <div class="card h-100">
              <img src="${img.ruta}" class="card-img-top" alt="${img.nombre}" style="height: 160px; object-fit: cover;">
              <div class="card-body p-2">
                <p class="card-text text-truncate small text-muted mb-0" title="${img.nombre}">${img.nombre}</p>
              </div>
            </div>
          `;
          galeria.appendChild(col);
        });
      } catch (err) {
        mensajeError.style.display = 'block';
      }
    }

    cargarImagenes();
  </script>
</body>
</html>
