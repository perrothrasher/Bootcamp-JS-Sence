<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Biblioteca El Saber</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <main class="container py-4">
    <h1 class="mb-3">Biblioteca Comunitaria “El Saber”</h1>

    <p class="text-muted">
      Catálogo de libros administrado con Express, Axios y File System.
    </p>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Agregar libro</h2>

        <form id="formLibro">
          <div class="row g-2">
            <div class="col-md-4">
              <input
                id="titulo"
                class="form-control"
                placeholder="Título"
              />
            </div>

            <div class="col-md-4">
              <input
                id="autor"
                class="form-control"
                placeholder="Autor"
              />
            </div>

            <div class="col-md-4">
              <input
                id="anio"
                type="number"
                class="form-control"
                placeholder="Año"
              />
            </div>
          </div>

          <button class="btn btn-primary mt-3" type="submit">
            Guardar libro
          </button>
        </form>
      </div>
    </section>

    <section class="card mb-4">
      <div class="card-body">
        <h2 class="h5">Actualizar libro</h2>

        <div class="row g-2">
          <div class="col-md-2">
            <input
              id="editId"
              type="number"
              class="form-control"
              placeholder="ID"
            />
          </div>

          <div class="col-md-3">
            <input
              id="editTitulo"
              class="form-control"
              placeholder="Nuevo título"
            />
          </div>

          <div class="col-md-3">
            <input
              id="editAutor"
              class="form-control"
              placeholder="Nuevo autor"
            />
          </div>

          <div class="col-md-2">
            <input
              id="editAnio"
              type="number"
              class="form-control"
              placeholder="Año"
            />
          </div>

          <div class="col-md-2">
            <button id="btnActualizar" class="btn btn-warning w-100">
              Actualizar
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-body">
        <h2 class="h5">Catálogo</h2>

        <button id="btnCargar" class="btn btn-dark mb-3">
          Cargar libros
        </button>

        <div id="mensaje"></div>

        <div id="listaLibros"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
