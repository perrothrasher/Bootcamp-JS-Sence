<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Callbacks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">
    <header class="container text-center mb-5">
        <h1 class="display-5 fw-bold">Actividad de Callbacks</h1>
    </header>
    <main class="container">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">1. Validar Número</h5>
                        <button id="btn-validar_numero" class="btn btn-dark mt-auto mb-3">Ingresar dato</button>
                        <div id="respuesta-validar_numero" class="p-2 border rounded bg-white text-break" style="min-height: 50px;">
                            <span class="text-muted small">Esperando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">2. Sumatoria Impares</h5>
                        <button id="btn-sumatoria_impares" class="btn btn-dark mt-auto mb-3">Calcular</button>
                        <div id="respuesta-sumatoria_impares" class="p-2 border rounded bg-white text-break" style="min-height: 50px;">
                            <span class="text-muted small">Esperando...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center d-flex flex-column">
                        <h5 class="card-title">3. Sumatorias Sucesivas</h5>
                        <button id="btn-sumatorias_sucesivas" class="btn btn-dark mt-auto mb-3">Generar sumatorias</button>
                        <div id="respuesta-sumatorias_sucesivas" class="p-2 border rounded bg-white text-break" style="min-height: 50px;">
                            <span class="text-muted small">Esperando...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/app.js"></script>
</body>

</html>
