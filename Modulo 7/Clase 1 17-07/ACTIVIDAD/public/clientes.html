<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        margin: 40px; 
        background: #f4f6f8; 
    }
    h1 { 
        color: #2c3e50; 
    }
    ul { 
        list-style: none; 
        padding: 0; 
    }
    li {
        background: white; 
        border: 1px solid #ddd; 
        border-radius: 6px;
        padding: 12px 16px; 
        margin-bottom: 10px;
    }
    li strong { 
        color: #2c3e50; 
    }
    li span.email { 
        color: #555; 
    }
    li span.telefono { 
        color: #888; 
        font-size: 0.9em; 
    }
    #error-box {
        display: none; 
        background: #fdecea; 
        color: #611a15;
        border: 1px solid #f5c6cb; 
        padding: 12px; 
        border-radius: 6px; 
        margin-bottom: 16px;
    }
    </style>
</head>
<body>
  <h1>Lista de Clientes</h1>
  <div id="error-box"></div>
  <ul id="lista-clientes"></ul>

<script>
  async function cargarClientes() {
    const errorBox = document.getElementById('error-box');
    const lista = document.getElementById('lista-clientes');

    try {
      const resp = await fetch('/clientes');

      if (!resp.ok) {
        throw new Error(`El servidor respondió con estado ${resp.status}`);
      }

      const json = await resp.json();

      if (!json.ok) {
        throw new Error(json.error || 'Error desconocido del servidor');
      }

      lista.innerHTML = json.data.map(c => `
        <li>
          <strong>${c.nombre}</strong><br>
          <span class="email">${c.email}</span><br>
          <span class="telefono">${c.telefono ?? 'Sin teléfono'}</span>
        </li>
      `).join('');

    } catch (err) {
      errorBox.style.display = 'block';
      errorBox.textContent = `No se pudo cargar la información: ${err.message}`;
      console.error(err);
    }
  }

  cargarClientes();
</script>
</body>
</html>
