<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción JS</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <h2 id="titulo">Ejemplo de incorporación de JS</h2>

    <!--Ejemplo de JS en linea-->
    <button class="btn btn-primary my-2" onclick="alert('Hola mundo'); console.log('Hola mundo desde la consola');">
        JS en Linea
    </button>

    <!--Ejemplo de JS interno-->
    <button class="btn btn-success my-2" onclick="mensajeInterno()">
        JS en Linea
    </button>

    <!--Ejemplo de JS externo-->
    <button id="miBoton"  class="btn btn-warning my-2" onclick="mensajeExterno()">
        JS en Linea
    </button>

    <!--Titulo cambiado con texto-->
    <button class="btn btn-secondary my-2" onclick="cambiarTexto()">
        Cambiar texto
    </button>

    <script>
        function mensajeInterno(){
            alert('Hola mundo desde el script interno');
            console.log('Hola mundo desde la consola');
        }
    </script>





    <script src="assets/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
